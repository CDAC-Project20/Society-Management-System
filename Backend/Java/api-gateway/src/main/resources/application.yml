server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: society-service
          uri: lb://society
          predicates:
            - Path=/api/**
          # filters:
          #   - RewritePath=/api/(?<segment>.*), /$\{segment}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true



# api -- 8080
# service1--8081  auth-service login register
# service2--8082  society-service
# service3--8083  transaction-service



