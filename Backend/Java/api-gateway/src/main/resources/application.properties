server.port=8080
spring.application.name=api-gateway

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Global CORS configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# Deduplicate CORS headers from downstream services
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods, RETAIN_FIRST

# Route 1: Auth Service (Port 8081)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /users/**, /login/**, /registerUser/**, /auth/**

# Route 2: Society Service (Port 8082 - including complaints, notices, flats, societies)
spring.cloud.gateway.routes[1].id=society-service
spring.cloud.gateway.routes[1].uri=lb://society-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/society/**, /societies/**, /flats/**,/owner/**,/tenant/**,/secretary/**, /complaints/**, /notices/**

# Route 3: Transaction Service - Document (Port 8083)
spring.cloud.gateway.routes[2].id=transaction-document-service
spring.cloud.gateway.routes[2].uri=lb://transaction-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/document/**, /documents/**

# Route 4: Transaction Service - Payment (Port 8083)
spring.cloud.gateway.routes[3].id=transaction-payment-service
spring.cloud.gateway.routes[3].uri=lb://transaction-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payment/**, /payments/**
